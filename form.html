<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buat Account Baru</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="card shadow mx-auto" style="max-width: 700px;">
    <div class="card-body">

      <h2 class="text-center text-primary">Buat Account Baru</h2>
      <h4 class="text-center mb-4">Sign Up Form</h4>

      <form action="welcome.html" method="get">

        <div class="mb-3">
          <label class="form-label">First Name</label>
          <input type="text" name="firstname" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Last Name</label>
          <input type="text" name="lastname" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Gender</label>

          <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" value="male">
            <label class="form-check-label">Male</label>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" value="female">
            <label class="form-check-label">Female</label>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Nationality</label>
          <select name="nationality" class="form-select">
            <option value="indonesia">Indonesia</option>
            <option value="malaysia">Malaysia</option>
            <option value="singapore">Singapore</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Language Spoken</label>

          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="lang_id">
            <label class="form-check-label">Bahasa Indonesia</label>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="lang_en">
            <label class="form-check-label">English</label>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="lang_other">
            <label class="form-check-label">Other</label>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Bio</label>
          <textarea name="bio" rows="5" class="form-control"></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100">
          Sign Up
        </button>

      </form>

    </div>
  </div>
</div>

</body>
</html>
